name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.cxx }} (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        build_type: [Debug, Release]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Report toolchain versions
        run: |
          ${{ matrix.cxx }} --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan:
    name: ASan + UBSan (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset asan -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        run: ctest --preset asan

  lint:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Report toolchain version
        run: clang-tidy-18 --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug

      - name: Run clang-tidy
        run: run-clang-tidy-18 -p build

  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Report toolchain version
        run: clang-format-18 --version

      - name: Check formatting
        run: >
          git ls-files -- '*.cpp' '*.hpp' '*.h' '*.cc' '*.hh' '*.cxx' '*.hxx'
          | xargs --no-run-if-empty clang-format-18 --dry-run --Werror
